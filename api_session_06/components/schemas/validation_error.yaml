type: object
properties:
  error:
    type: string
    example: "Unprocessable Entity"
  message:
    type: string
    example: "Dữ liệu đầu vào không hợp lệ."
  details:
    type: array
    items:
      type: object
      properties:
        field:
          type: string
          example: "email"
        issue:
          type: string
          example: "Email không đúng định dạng"